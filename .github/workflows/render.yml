name: Render Reel

# n8n is workflow ko GitHub API se chalata hai:
#   POST https://api.github.com/repos/<OWNER>/<REPO>/actions/workflows/render.yml/dispatches
#   body: {"ref":"main","inputs":{"job":"<job JSON string>"}}
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job JSON (products, photos, voice lines)"
        required: true
        type: string

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: Download voice model (first run only)
        run: |
          if [ ! -f voices/en-us-ryan-high.onnx ]; then
            mkdir -p voices && cd voices
            curl -sSL -o v.tgz https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz
            tar xzf v.tgz && rm v.tgz
          fi

      - name: Install fonts, ffmpeg, Piper, Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-noto-color-emoji ffmpeg jq > /dev/null
          pip install -q piper-tts==1.8.0
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Build + render
        run: python pipeline/build.py --json "$JOB"

      - name: Publish video
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(jq -r .id out/result.json)
          TAG="reel-${ID}-${{ github.run_id }}"
          FILE="out/${ID}.mp4"
          gh release create "$TAG" "$FILE" --title "$TAG" --notes "Auto reel" --latest=false
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ID}.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Video: $URL"

      - name: Tell n8n (done)
        if: success()
        env:
          CALLBACK: ${{ vars.N8N_CALLBACK_URL }}
        run: |
          [ -z "$CALLBACK" ] && { echo "N8N_CALLBACK_URL variable nahi hai, skip"; exit 0; }
          jq --arg url "${{ steps.pub.outputs.url }}" \
             --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
             '. + {status:"done", video_url:$url, run_url:$run} | del(.file)' out/result.json > cb.json
          curl -sS -X POST "$CALLBACK" -H "Content-Type: application/json" --data @cb.json

      - name: Tell n8n (failed)
        if: failure()
        env:
          CALLBACK: ${{ vars.N8N_CALLBACK_URL }}
        run: |
          [ -z "$CALLBACK" ] && exit 0
          ID=$(echo "$JOB" | jq -r '.id // "reel"' 2>/dev/null || echo reel)
          curl -sS -X POST "$CALLBACK" -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"id\":\"$ID\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Purani videos saaf karo (sirf latest 90 rakho)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 500 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[90:] | .[].tagName' |
          while read -r t; do [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag; done || true
