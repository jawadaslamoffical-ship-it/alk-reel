name: Voice Samples

# Alag alag Microsoft Neural voices ke chhote samples banata hai (release: voice-samples)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/voices.yml"]

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Samples banao
        run: |
          pip install -q edge-tts
          V=en-US-ChristopherNeural
          mkdir s && cd s
          n=1
          while IFS= read -r NAME; do
            edge-tts --voice "$V" --rate=+8% --text "${NAME}. Industrial Area five, Sharjah." --write-media "name-${n}.mp3" && echo "ok $n $NAME" || echo "FAIL $n"
            n=$((n+1)); sleep 2
          done <<'EOF'
          Al Khaleej Al Thahabi
          Al Khaleej Al Zahabi
          Al Khaleej Al Dhahabi
          Al Kha-leej Al Tha-habi
          Al-Khaleej Al-Thahabee
          EOF
          find . -size -2k -print -delete
          ls -la
      - name: Release mein daalo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete voice-samples --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create voice-samples s/*.mp3 -R "$GITHUB_REPOSITORY" --title "Voice samples" --notes "Reel voice samples"
